<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Box of Memories</title>
<style nonce="__NONCE__">
/* Warm paper on a powder-blue desk, cobalt for what can be done, and the
   chats kept in a blush box. Bricolage Grotesque for Latin and figures,
   Songti Black for headings. */
@font-face {
  font-family: "Bric"; src: url("/static/bricolage.woff2") format("woff2");
  font-weight: 400 800; font-display: swap;
}
:root {
  --canvas-a: #DFE8F6; --canvas-b: #D6E0F2; --glow: rgba(255, 255, 255, .55); --desk-pink: rgba(246, 205, 205, .95);
  --paper: #FBF8F3; --paper-2: #F3EEE6; --surface: #fff;
  --ink: #14172D; --ink-2: #4B4F66; --ink-3: #6B6F86; --ph: #8E92A6; --on-ink: #fff;
  --line: rgba(20, 23, 45, .13); --line-2: rgba(20, 23, 45, .3); --hair: rgba(20, 23, 45, .09);
  --cobalt: #2341E4; --cobalt-h: #2B49EC; --cobalt-d: #1A31B8; --cobalt-text: #2341E4;
  --cobalt-tint: #EEF1FE; --cobalt-line: rgba(35, 65, 228, .14); --ring: rgba(35, 65, 228, .2);
  --blush: #F6D6D3; --blush-l: #FBE6E3; --blush-d: #EDB7B6; --powder: #DCE5F4;
  --on-blush-hover: rgba(255, 255, 255, .42); --glass: rgba(255, 255, 255, .58);
  --tomato: #DF3E26; --tomato-t: #C42F18; --tomato-tint: #FDEEEA;
  --mark: #F7C9C4; --mark-ink: #14172D; --scrim: rgba(20, 23, 45, .32);
  --panel-shadow: 0 0 0 1px rgba(20, 23, 45, .04), 0 2px 4px rgba(20, 23, 45, .05),
    0 38px 70px -28px rgba(35, 65, 228, .3), 0 18px 36px -18px rgba(20, 23, 45, .22);
  --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 10px 20px -10px rgba(35, 65, 228, .7), 0 2px 4px rgba(20, 23, 45, .14);
  --sel-shadow: 0 8px 16px -10px rgba(35, 65, 228, .45);
  --f-ui: "Bric", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-display: "Bric", "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-slide: cubic-bezier(.34, 1.25, .64, 1);
  color-scheme: light;
}
/* Night: the desk goes ink-blue, the paper a deep slate, the box a dark rose. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas-a: #161A35; --canvas-b: #0D1024; --glow: rgba(110, 132, 255, .1); --desk-pink: rgba(150, 70, 110, .32);
    --paper: #191C30; --paper-2: #23273E; --surface: #21253B;
    --ink: #ECEEF7; --ink-2: #B3B7D0; --ink-3: #8F94B0; --ph: #737896; --on-ink: #14172D;
    --line: rgba(236, 238, 247, .12); --line-2: rgba(236, 238, 247, .26); --hair: rgba(236, 238, 247, .08);
    --cobalt: #5468FF; --cobalt-h: #6276FF; --cobalt-d: #4256EC; --cobalt-text: #9AA8FF;
    --cobalt-tint: rgba(110, 132, 255, .13); --cobalt-line: rgba(110, 132, 255, .22); --ring: rgba(110, 132, 255, .3);
    --blush: #4A2D3D; --blush-l: #5E3A4D; --blush-d: #A0607A; --powder: #2E3958;
    --on-blush-hover: rgba(255, 255, 255, .06); --glass: rgba(255, 255, 255, .06);
    --tomato: #FF6F59; --tomato-t: #FF8E7C; --tomato-tint: rgba(255, 111, 89, .12);
    --mark: #F4B9C4; --mark-ink: #14172D; --scrim: rgba(5, 7, 18, .6);
    --panel-shadow: 0 0 0 1px rgba(255, 255, 255, .05), 0 38px 70px -28px rgba(0, 0, 0, .6), 0 18px 36px -18px rgba(0, 0, 0, .5);
    --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 10px 20px -10px rgba(84, 104, 255, .6), 0 2px 4px rgba(0, 0, 0, .3);
    --sel-shadow: 0 8px 18px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas-a: #161A35; --canvas-b: #0D1024; --glow: rgba(110, 132, 255, .1); --desk-pink: rgba(150, 70, 110, .32);
  --paper: #191C30; --paper-2: #23273E; --surface: #21253B;
  --ink: #ECEEF7; --ink-2: #B3B7D0; --ink-3: #8F94B0; --ph: #737896; --on-ink: #14172D;
  --line: rgba(236, 238, 247, .12); --line-2: rgba(236, 238, 247, .26); --hair: rgba(236, 238, 247, .08);
  --cobalt: #5468FF; --cobalt-h: #6276FF; --cobalt-d: #4256EC; --cobalt-text: #9AA8FF;
  --cobalt-tint: rgba(110, 132, 255, .13); --cobalt-line: rgba(110, 132, 255, .22); --ring: rgba(110, 132, 255, .3);
  --blush: #4A2D3D; --blush-l: #5E3A4D; --blush-d: #A0607A; --powder: #2E3958;
  --on-blush-hover: rgba(255, 255, 255, .06); --glass: rgba(255, 255, 255, .06);
  --tomato: #FF6F59; --tomato-t: #FF8E7C; --tomato-tint: rgba(255, 111, 89, .12);
  --mark: #F4B9C4; --mark-ink: #14172D; --scrim: rgba(5, 7, 18, .6);
  --panel-shadow: 0 0 0 1px rgba(255, 255, 255, .05), 0 38px 70px -28px rgba(0, 0, 0, .6), 0 18px 36px -18px rgba(0, 0, 0, .5);
  --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 10px 20px -10px rgba(84, 104, 255, .6), 0 2px 4px rgba(0, 0, 0, .3);
  --sel-shadow: 0 8px 18px -10px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink);
  font: 14px/1.55 var(--f-ui); font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background:
    radial-gradient(900px 640px at 6% 100%, var(--desk-pink), transparent 68%) fixed,
    radial-gradient(700px 520px at 100% 0%, var(--desk-pink), transparent 70%) fixed,
    radial-gradient(1100px 720px at 50% 42%, var(--glow), transparent 70%) fixed,
    linear-gradient(180deg, var(--canvas-a), var(--canvas-b)) fixed;
  background-color: var(--canvas-b);
}
::selection { background: var(--ring); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cobalt-text); }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sprites { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 40px; padding: 0 16px; border: 0; border-radius: 12px;
  background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: box-shadow .16s, background .16s, color .16s, transform .14s var(--ease-out);
}
.btn:hover { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:focus-visible { outline: 0; box-shadow: inset 0 0 0 1.5px var(--cobalt), 0 0 0 4px var(--ring); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; }
.btn.small .i { width: 15px; height: 15px; }
.btn.danger { color: var(--tomato-t); }
.btn.danger:hover { background: var(--tomato-tint); box-shadow: inset 0 0 0 1px var(--tomato); }
.btn.primary {
  height: 56px; padding: 0 20px 0 22px; border-radius: 16px; justify-content: space-between;
  background: var(--cobalt); color: #fff; box-shadow: var(--btn-shadow);
  font-size: 16px; letter-spacing: .02em;
}
.btn.primary .i { width: 20px; height: 20px; }
.btn.primary:hover { background: var(--cobalt-h); color: #fff; transform: translateY(-1px); box-shadow: var(--btn-shadow); }
.btn.primary:active:not(:disabled) { background: var(--cobalt-d); transform: translateY(1px) scale(.986, .95); }
.btn.primary:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--cobalt); }
.btn.primary:disabled { opacity: 1; cursor: progress; }
.spin { display: none; width: 18px; height: 18px; border-radius: 50%; border: 2.2px solid rgba(255, 255, 255, .3); border-top-color: #fff; animation: spin .8s linear infinite; }
.btn.primary:disabled .spin { display: block; }
.btn.primary:disabled .i { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Text fields and selects sit in a .control, which draws the frame. */
.control {
  position: relative; display: flex; align-items: center; height: 40px; min-width: 0;
  border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow .16s, background .16s;
}
.control:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
.control:focus-within { box-shadow: inset 0 0 0 1.5px var(--cobalt), 0 0 0 4px var(--ring); }
.control > .i { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--ink-3); pointer-events: none; transition: color .16s; }
.control:focus-within > .i { color: var(--cobalt-text); }
.field {
  -webkit-appearance: none; appearance: none; flex: 1; width: 100%; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent; border-radius: inherit; padding: 0 12px;
  font-size: 14px; caret-color: var(--cobalt); font-variant-numeric: tabular-nums; text-overflow: ellipsis;
}
.field::placeholder { color: var(--ph); }
.control.icon .field { padding-left: 37px; }
.control.select .field { padding-right: 32px; cursor: pointer; }
.control.select > .i { left: auto; right: 10px; width: 16px; height: 16px; }
.control.select select option { color: var(--ink); background: var(--surface); }
.control.lg { height: 50px; }
.control.lg .field { padding: 0 14px; font-size: 15px; text-align: center; }

/* Sign-in: a paper card, the name kept in its blush box. */
.auth { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.auth-card {
  width: 100%; max-width: 420px; padding: 14px 14px 20px; border-radius: 28px;
  background: var(--paper); box-shadow: var(--panel-shadow); text-align: center;
  animation: rise .6s var(--ease-out) both;
}
.auth-card .brand-lg {
  display: flex; justify-content: center; margin: 0 0 24px; padding: 34px 0 30px;
  border-radius: 20px; background: var(--blush);
}
.auth-card #signin, .auth-card #enroll, .auth-card .auth-msg { padding: 0 22px; }
.auth-card p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.nb { display: inline-block; }
.auth-card .btn { width: 100%; margin-top: 10px; }
.auth-card .btn:not(.primary) { height: 50px; border-radius: 14px; font-size: 15px; }
.auth-card .control { margin-bottom: 4px; }
.auth-msg { margin: 12px 0 0 !important; min-height: 20px; font-size: 13px; line-height: 20px; color: var(--ink-3) !important; }
.auth-msg:empty { min-height: 0; margin: 0 !important; }
.auth-msg.error { color: var(--tomato-t) !important; animation: nudge .34s var(--ease-out); }
@keyframes nudge { 22% { transform: translateX(-5px); } 50% { transform: translateX(3.5px); } 78% { transform: translateX(-1.5px); } }

/* Box of Memories: words in Satisfy, each uncovered by a wide pen
   stroke sweeping up and down through its letters along a mask path, one word
   after another. */
.glyphs { position: absolute; width: 0; height: 0; overflow: hidden; }
.brand { margin: 0; line-height: 0; }
.brand-svg { display: block; overflow: visible; height: auto; }
.brand .w-box, .brand .w-of { color: var(--ink); }
.brand .w-memories { color: var(--cobalt-text); }
.brand-lg .brand-svg { width: 248px; }
.brand-sm .brand-svg { height: 40px; width: auto; margin: -6px 0 -4px; }
.brand .sweep { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

/* Login: written, held, rewound last word first, in a 12 s loop. */
.stacked .sw-box { animation: brand-box 12s linear infinite; }
.stacked .sw-of { animation: brand-of 12s linear infinite; }
.stacked .sw-memories { animation: brand-memories 12s linear infinite; }
@keyframes brand-box      { 0%, 3.3%  { stroke-dashoffset: 1; } 20.8%, 92.5% { stroke-dashoffset: 0; } 96.7%, 100% { stroke-dashoffset: 1; } }
@keyframes brand-of       { 0%, 22.9% { stroke-dashoffset: 1; } 28.8%, 90.8% { stroke-dashoffset: 0; } 92.5%, 100% { stroke-dashoffset: 1; } }
@keyframes brand-memories { 0%, 30.8% { stroke-dashoffset: 1; } 57.5%, 83.3% { stroke-dashoffset: 0; } 90.8%, 100% { stroke-dashoffset: 1; } }
/* Header: written once, at twice the pace. */
.inline .sw-box { animation: brand-write 1.05s .3s linear forwards; }
.inline .sw-of { animation: brand-write .35s 1.45s linear forwards; }
.inline .sw-memories { animation: brand-write 1.6s 1.9s linear forwards; }
@keyframes brand-write { to { stroke-dashoffset: 0; } }

/* Image viewer */
dialog.viewer { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; border: 0; border-radius: 0; background: transparent; padding: 0; box-shadow: none; animation: none; }
dialog.viewer::backdrop { background: rgba(10, 12, 28, .9); backdrop-filter: none; }
.viewer-body { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; animation: pop .28s var(--ease-out); }
.viewer-close {
  position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border-radius: 50%;
  border: 0; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; padding: 0;
  transition: background .16s, transform .14s var(--ease-out);
}
.viewer-close:hover { background: rgba(255, 255, 255, .26); }
.viewer-close:active { transform: scale(.94); }
.media a.zoom { cursor: zoom-in; display: inline-block; }

/* App: one sheet of paper on the desk. */
.app {
  width: min(1440px, calc(100% - 64px)); height: calc(100% - 56px); height: calc(100dvh - 56px); margin: 28px auto;
  padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px;
  background: var(--paper); border-radius: 28px; box-shadow: var(--panel-shadow); overflow: hidden;
}
.top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.top > div:first-child { display: flex; align-items: center; gap: 14px; min-width: 0; }
.top .sub { position: relative; padding-left: 14px; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub::before { content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: var(--line-2); }
.top .grow { flex: 1; }
.top .global { width: 340px; }

/* Figures in one white strip, split by hairlines. */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); }
.stat { position: relative; min-width: 0; padding: 12px 18px 13px; }
.stat + .stat::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--hair); }
.stat .k { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.stat .v {
  margin-top: 3px; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.2;
  letter-spacing: -.015em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .v.ok { color: var(--cobalt-text); display: flex; align-items: center; gap: 8px; }
.stat .v.ok::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 var(--ring); animation: beat 2.4s var(--ease-out) infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 var(--ring); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.stat .d { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; gap: 22px; }
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel-head { padding: 14px 18px 10px; display: flex; align-items: center; gap: 10px; }
.panel-head h2 {
  margin: 0; flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 900; font-size: 20px;
  line-height: 1.3; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-head .count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* The box of chats */
#chats-panel { background: var(--blush); border-radius: 22px; padding-top: 4px; }
.chat-tools { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.seg { position: relative; display: flex; height: 34px; padding: 3px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { position: relative; z-index: 1; flex: 1; border: 0; background: none; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); transition: color .2s; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--on-ink); }
.seg button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 1px; }
.seg .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--ink); }
.seg.ready .pill { transition: transform .34s var(--ease-slide), width .34s var(--ease-slide); }
.chat-list { flex: 1; overflow-y: auto; padding: 2px 10px 12px; }
.chat {
  position: relative; display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; align-items: center;
  width: 100%; padding: 9px 10px; border: 0; border-radius: 14px; background: transparent; text-align: left;
  transition: background .16s, box-shadow .16s;
}
.chat + .chat::before { content: ""; position: absolute; left: 62px; right: 10px; top: 0; height: 1px; background: var(--hair); transition: opacity .16s; }
.chat:hover::before, .chat.on::before, .chat:hover + .chat::before, .chat.on + .chat::before { opacity: 0; }
.chat:hover { background: var(--on-blush-hover); }
.chat.on { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--cobalt), var(--sel-shadow); }
.chat:focus-visible { outline: 0; box-shadow: inset 0 0 0 1.5px var(--cobalt), 0 0 0 4px var(--ring); }
.thumb {
  width: 40px; height: 44px; border-radius: 20px 20px 8px 8px; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 900; font-size: 17px; color: var(--ink);
  background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair);
}
.thumb.t-Group { background: var(--blush-l); }
.thumb.t-MP { background: var(--powder); }
.thumb.t-System { background: var(--paper-2); color: var(--ink-2); }
.chat .body { display: block; min-width: 0; }
.chat .n { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .m { display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.chat .m span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .m .t { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }

/* Messages, straight on the paper */
.msg-head { padding: 4px 2px 14px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.msg-head .title { flex: 1; min-width: 160px; }
.msg-head .title h2 { flex: none; font-size: 22px; }
.msg-head .title .m { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.msg-head .in-chat { width: 220px; }
.dates { display: flex; align-items: center; gap: 6px; }
.dates .field { padding: 0 10px; }
.dates .to { color: var(--ink-3); font-size: 13px; }
.dates .btn { width: 28px; padding: 0; }
.back { display: none; }
.msg-list {
  flex: 1; overflow-y: auto; padding: 14px 4px 8px 2px; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px); mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
}
.msg-list.enter { animation: lift .3s var(--ease-out); }
.empty { color: var(--ink-3); text-align: center; padding: 56px 12px; }
.loader { color: var(--ink-3); text-align: center; font-size: 12.5px; padding: 8px; }
.day { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.day span { padding: 3px 12px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

.msg { position: relative; padding: 11px 14px 12px; border-radius: 14px; transition: background .16s, box-shadow .2s; }
.msg + .msg::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: var(--hair); }
.msg.out::before, .msg.out + .msg::before, .msg.target::before, .msg.target + .msg::before { opacity: 0; }
@media (hover: hover) {
  .msg:not(.out):not(.system):hover { background: var(--surface); }
  .msg:not(.out):not(.system):hover::before, .msg:not(.out):not(.system):hover + .msg::before { opacity: 0; }
}
.msg.out, .msg.target { margin: 2px 0; }
.msg.out { background: var(--cobalt-tint); box-shadow: inset 0 0 0 1px var(--cobalt-line); }
.msg.target { box-shadow: inset 0 0 0 1.5px var(--cobalt), 0 0 0 4px var(--ring); }
.msg.system { margin: 6px 0; background: var(--paper-2); color: var(--ink-2); font-size: 13px; }
.msg.system::before, .msg.system + .msg::before { display: none; }
.msg.system .who { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
.msg-top { display: flex; gap: 10px; align-items: baseline; }
.msg-top .who { font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.out .who { color: var(--cobalt-text); }
.msg-top .where { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-top .meta { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.msg-top .meta a {
  margin-left: 6px; padding: 1px 5px; border-radius: 6px; color: var(--ink-3); text-decoration: none;
  font-weight: 600; transition: color .16s, background .16s;
}
.msg-top .meta a:hover { color: var(--cobalt-text); background: var(--cobalt-tint); }
img.broken { display: none; }
.media .gone { color: var(--ink-3); font-size: 13px; }
.msg-body { margin-top: 3px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg mark { background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 0 2px; }
.placeholder { color: var(--ink-3); }
.reply {
  margin: 6px 0 4px; padding: 5px 10px; border-left: 3px solid var(--blush-d); border-radius: 4px 10px 10px 4px;
  background: var(--blush-l); color: var(--ink-2); font-size: 13px; cursor: pointer; transition: background .16s;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.reply:hover { background: var(--blush); }
.reply b { color: var(--ink); font-weight: 600; }
.media { margin-top: 8px; }
.media img, .media video { display: block; max-width: min(100%, 360px); max-height: 320px; border-radius: 12px; background: var(--paper-2); }
.media img.sticker, .media video.sticker { max-width: 160px; max-height: 160px; background: transparent; }
.media audio { width: min(100%, 320px); }
.link-card {
  display: flex; gap: 12px; max-width: 520px; margin-top: 8px; padding: 10px 12px; border-radius: 12px;
  background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair); color: inherit; text-decoration: none; transition: box-shadow .16s;
}
.link-card:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
.link-card img { flex: none; width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
.link-card .lt { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.link-card .ld { font-size: 12.5px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.actions a.btn { text-decoration: none; }

/* Dialogs */
dialog {
  width: min(520px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 24px;
  background: var(--paper); color: var(--ink); box-shadow: var(--panel-shadow);
}
dialog[open] { animation: pop .26s var(--ease-out); }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(3px); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 20px 22px 4px; }
.dlg-head h2 { margin: 0; flex: 1; font-family: var(--f-display); font-weight: 900; font-size: 20px; letter-spacing: .01em; }
.dlg-body { padding: 6px 22px 22px; }
.dlg-body p { margin: 4px 0 12px; color: var(--ink-2); font-size: 13.5px; text-wrap: pretty; }
.device { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; column-gap: 12px; padding: 12px 0; }
.device + .device { border-top: 1px solid var(--hair); }
.device .thumb { background: var(--powder); color: var(--ink-2); }
.device .thumb .i { width: 19px; height: 19px; }
.device .info { min-width: 0; }
.device .n { font-weight: 600; }
.device .m { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tag { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--cobalt-tint); color: var(--cobalt-text); font-size: 11px; font-weight: 600; vertical-align: 1px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; }

/* Motion: arriving once, panels sliding in from where they sit. */
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes lift { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes from-right { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes from-left { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (min-width: 821px) {
  .app { animation: lift .45s var(--ease-out) both; }
  .app .stats { animation: lift .45s .06s var(--ease-out) both; }
  .app #chats-panel { animation: lift .45s .12s var(--ease-out) both; }
  .app #messages-panel { animation: lift .45s .18s var(--ease-out) both; }
}

@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .stats .stat:nth-child(n+4) { display: none; }
  .top .global { width: 260px; }
  .main { grid-template-columns: 300px 1fr; gap: 18px; }
}
@media (max-width: 820px) {
  .app {
    width: 100%; height: 100%; height: 100dvh; margin: 0; border-radius: 0; box-shadow: none; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
  }
  .top { flex-wrap: wrap; }
  .brand-sm .brand-svg { height: 34px; }
  .top .sub { display: none; }
  .top .global { order: 5; width: 100%; }
  .stats { grid-template-columns: repeat(3, 1fr); border-radius: 16px; }
  .stat { padding: 9px 12px; }
  .stat .v { font-size: 18px; }
  .stat .d { display: none; }
  .main { grid-template-columns: 1fr; }
  #chats-panel { border-radius: 20px; animation: from-left .32s var(--ease-out); }
  .app.viewing #messages-panel { animation: from-right .32s var(--ease-out); }
  .app.viewing .stats, .app.viewing .top, .app.viewing #chats-panel { display: none; }
  .app:not(.viewing) #messages-panel { display: none; }
  .back { display: inline-flex; padding-left: 7px; }
  .msg-head { padding-top: 0; }
  .msg-head .title { flex: 1 1 calc(100% - 96px); }
  .msg-head .title h2 { font-size: 19px; }
  .msg-head #types-box { order: 4; }
  .msg-head .dates { order: 6; flex: 1 1 100%; min-width: 0; }
  .dates .control { flex: 1; }
  .msg-head .in-chat { width: auto; flex: 1; order: 5; min-width: 0; }
  .msg-list { padding: 10px 0 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .brand .sweep { animation: none !important; stroke-dashoffset: 0; }
  .stat .v.ok::before { animation: none !important; }
}
</style>
</head>

<script nonce="__NONCE__">
"use strict";
const $ = (id) => document.getElementById(id);
const TYPE_LABEL = { Text: "文字", Link: "链接", Image: "图片", Video: "视频", Animation: "动图", File: "文件",
  Voice: "语音", Sticker: "表情", Location: "位置", Unsupported: "不支持", Status: "状态" };
const KIND_LABEL = { Group: "群聊", Private: "私聊", MP: "公众号", System: "系统" };
// Where in Telegram a message was delivered, apart from what kind of chat it is.
const PLACE_LABEL = { bot: "Bot 私聊", topic: "话题", group: "绑定群" };
function chatMeta(c) {
  return (KIND_LABEL[c.type] || "会话") + (PLACE_LABEL[c.place] ? " · " + PLACE_LABEL[c.place] : "") +
    " · " + fmtNum(c.count) + " 条";
}

// "Box of Memories" above is in Satisfy (© 2011 Font Diner, Inc., Apache License 2.0),
// as outlines so that no font is loaded.

// region Utilities

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtNum(n) { return Number(n || 0).toLocaleString("zh-CN"); }
function pad(n) { return String(n).padStart(2, "0"); }
function fmtTime(ts, full) {
  const d = new Date(ts * 1000), now = new Date();
  const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (!full && d.toDateString() === now.toDateString()) return hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}
function fmtDay(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " + "周" + "日一二三四五六"[d.getDay()];
}
function fmtAgo(ts) {
  if (!ts) return "–";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  if (s < 86400 * 30) return Math.floor(s / 86400) + " 天前";
  return fmtTime(ts, true);
}
function b64urlToBuf(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0)).buffer;
}
function bufToB64url(buf) {
  let bin = "";
  for (const b of new Uint8Array(buf)) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
async function api(path, options = {}) {
  const init = { method: options.method || "GET", headers: {}, credentials: "same-origin" };
  if (options.body !== undefined) {
    init.method = options.method || "POST";
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(options.body);
  }
  let res;
  try { res = await fetch(path, init); } catch (e) { throw new ApiError(0, "网络错误，请检查连接。"); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) {
    if (res.status === 401 && !options.quiet) showAuth();
    throw new ApiError(res.status, (data && (data.error || data.detail)) || "请求失败（" + res.status + "）");
  }
  return data;
}

// endregion
// region Passkeys

function credentialJSON(cred) {
  if (typeof cred.toJSON === "function") {
    try { return cred.toJSON(); } catch (e) { /* fall through */ }
  }
  const r = cred.response, out = {
    id: cred.id, rawId: bufToB64url(cred.rawId), type: cred.type,
    authenticatorAttachment: cred.authenticatorAttachment || undefined,
    clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
    response: { clientDataJSON: bufToB64url(r.clientDataJSON) },
  };
  if (r.attestationObject) {
    out.response.attestationObject = bufToB64url(r.attestationObject);
    if (r.getTransports) out.response.transports = r.getTransports();
  } else {
    out.response.authenticatorData = bufToB64url(r.authenticatorData);
    out.response.signature = bufToB64url(r.signature);
    if (r.userHandle) out.response.userHandle = bufToB64url(r.userHandle);
  }
  return out;
}
function creationOptions(o) {
  return Object.assign({}, o, {
    challenge: b64urlToBuf(o.challenge),
    user: Object.assign({}, o.user, { id: b64urlToBuf(o.user.id) }),
    excludeCredentials: (o.excludeCredentials || []).map((c) => Object.assign({}, c, { id: b64urlToBuf(c.id) })),
  });
}
function requestOptions(o) {
  return Object.assign({}, o, {
    challenge: b64urlToBuf(o.challenge),
    allowCredentials: (o.allowCredentials || []).map((c) => Object.assign({}, c, { id: b64urlToBuf(c.id) })),
  });
}
function passkeyError(e) {
  if (e && e.name === "NotAllowedError") return "已取消，或验证超时。";
  if (e && e.name === "InvalidStateError") return "这台设备已经登记过了，直接登录即可。";
  if (e && e.name === "SecurityError") return "当前地址不能使用通行密钥，请用配置的域名通过 HTTPS 打开。";
  return (e && e.message) || "出错了。";
}

let enrollToken = null;

function authMsg(text, error) {
  const el = $("auth-msg");
  el.textContent = text || "";
  el.classList.toggle("error", !!error);
}
function showAuth() {
  $("app").hidden = true;
  $("auth").hidden = false;
  $("signin").hidden = !!enrollToken;
  $("enroll").hidden = !enrollToken;
  if (enrollToken && !$("device-name").value) $("device-name").value = guessDevice();
}
function guessDevice() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return "iPhone";
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/Macintosh/.test(ua)) return "Mac";
  if (/Android/.test(ua)) return "Android";
  if (/Windows/.test(ua)) return "Windows";
  return "";
}
async function withBusy(button, fn) {
  button.disabled = true;
  try { await fn(); } finally { button.disabled = false; }
}

$("login").onclick = () => withBusy($("login"), async () => {
  authMsg("");
  try {
    const { challenge, options } = await api("/api/login/options", { body: {}, quiet: true });
    const cred = await navigator.credentials.get({ publicKey: requestOptions(options) });
    await api("/api/login", { body: { challenge, credential: credentialJSON(cred) }, quiet: true });
    startApp();
  } catch (e) { authMsg(passkeyError(e), true); }
});
$("request").onclick = () => withBusy($("request"), async () => {
  authMsg("");
  try {
    await api("/api/enroll/request", { body: {}, quiet: true });
    authMsg("登记链接已由 bot 发到你的 Telegram。在这台设备上打开那条链接，10 分钟内有效。");
  } catch (e) { authMsg(e.message, true); }
});
$("enroll-go").onclick = () => withBusy($("enroll-go"), async () => {
  authMsg("");
  try {
    const { challenge, options } = await api("/api/enroll/options", { body: { token: enrollToken }, quiet: true });
    const cred = await navigator.credentials.create({ publicKey: creationOptions(options) });
    await api("/api/enroll", { body: { token: enrollToken, challenge, credential: credentialJSON(cred),
      name: $("device-name").value.trim() }, quiet: true });
    enrollToken = null;
    startApp();
  } catch (e) { authMsg(passkeyError(e), true); }
});
$("enroll-cancel").onclick = () => { enrollToken = null; authMsg(""); showAuth(); };

// endregion
// region App state

const state = {
  chats: [], chatMap: new Map(), kind: "", chat: null,
  mode: "idle",         // "chat": a chat in order; "search": results newest first
  query: null,          // {q, sender, chat}
  types: "",
  first: null, last: null, moreBefore: false, moreAfter: false, next: null,
  loading: false, token: 0, target: null,
};

async function startApp() {
  $("auth").hidden = true;
  $("app").hidden = false;
  placeKind();
  if (document.fonts) document.fonts.ready.then(placeKind);
  await Promise.all([loadStats(), loadChats()]);
}

async function loadStats() {
  try {
    const s = await api("/api/stats");
    $("s-messages").textContent = fmtNum(s.messages);
    $("s-chats").textContent = fmtNum(s.chats);
    $("s-range").textContent = s.last_message ? "最新一条 " + fmtAgo(s.last_message) : " ";
    const active = s.efb_active && Date.now() / 1000 - s.efb_active < 6 * 3600;
    $("s-efb").textContent = s.efb_active ? (active ? "运行中" : "无动静") : "未知";
    $("s-efb").classList.toggle("ok", !!active);
    $("s-efb-d").textContent = s.efb_active ? "数据库 " + fmtAgo(s.efb_active) + "有写入" : " ";
    $("s-sync").textContent = fmtAgo(s.synced_at);
    $("s-devices").textContent = fmtNum(s.devices);
  } catch (e) { /* stats are a nicety */ }
}

async function loadChats() {
  const { chats } = await api("/api/chats");
  state.chats = chats;
  state.chatMap = new Map(chats.map((c) => [c.key, c]));
  renderChats();
}

function renderChats() {
  const q = $("chat-q").value.trim().toLowerCase();
  const list = state.chats.filter((c) => (!state.kind || c.type === state.kind) &&
    (!q || c.name.toLowerCase().includes(q) || (c.original || "").toLowerCase().includes(q)));
  $("chat-count").textContent = list.length + " 个";
  const html = list.slice(0, 600).map((c) =>
    '<button class="chat' + (state.chat === c.key ? " on" : "") + '" data-key="' + esc(c.key) + '">' +
    '<span class="thumb t-' + esc(c.type || "") + '" aria-hidden="true">' + esc(Array.from(c.name.trim())[0] || "·") + "</span>" +
    '<span class="body"><span class="n">' + esc(c.name) + "</span>" +
    '<span class="m"><span>' + chatMeta(c) + "</span>" +
    '<span class="t">' + fmtTime(c.last_ts) + "</span></span></span></button>").join("");
  $("chat-list").innerHTML = html || '<div class="empty">没有匹配的会话</div>';
}

$("chat-list").onclick = (e) => {
  const b = e.target.closest(".chat");
  if (b) openChat(b.dataset.key);
};
$("chat-q").oninput = renderChats;
$("chat-kind").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state.kind = b.dataset.kind;
  for (const x of $("chat-kind").querySelectorAll("button")) x.classList.toggle("on", x === b);
  placeKind();
  renderChats();
};
// One pill slides under the picked kind. It is put in place without
// sliding until it has been placed once while visible.
function placeKind() {
  const seg = $("chat-kind"), on = seg.querySelector("button.on"), pill = seg.querySelector(".pill");
  if (!on || !on.offsetWidth) return;
  pill.style.width = on.offsetWidth + "px";
  pill.style.transform = "translateX(" + on.offsetLeft + "px)";
  if (!seg.classList.contains("ready")) requestAnimationFrame(() => seg.classList.add("ready"));
}
window.addEventListener("resize", () => {
  $("chat-kind").classList.remove("ready");
  placeKind();
});
// A list that is replaced, not extended, comes in once.
function enterList() {
  list.classList.remove("enter");
  void list.offsetWidth;
  list.classList.add("enter");
}

// endregion
// region Messages

const list = $("msg-list");

function setHeader(title, meta) {
  $("view-title").textContent = title;
  $("view-meta").textContent = meta || " ";
}

function openChat(key, around) {
  if (around) clearDates();
  else if (dateLabel()) {
    // With dates picked, a chat opens as its messages in that range.
    state.chat = key;
    renderChats();
    $("chat-search").value = "";
    startSearch("", key);
    return;
  }
  state.chat = key;
  state.mode = "chat";
  state.query = null;
  state.target = around || null;
  $("chat-search").value = "";
  $("chat-search").placeholder = "在此会话中搜索";
  const c = state.chatMap.get(key);
  setHeader(c ? c.name : key, c ? chatMeta(c) + " · " +
    fmtTime(c.first_ts, true) + " 起" + (c.original ? " · " + c.original : "") : "");
  renderChats();
  $("app").classList.add("viewing");
  loadChat(around ? { around } : {});
}

function typeParam() { return state.types ? "&types=" + state.types : ""; }

// Dates are picked in local time; "until" covers the whole of its day.
function dayStart(value, days) {
  if (!value) return null;
  const d = new Date(value + "T00:00:00");
  d.setDate(d.getDate() + (days || 0));
  return Math.floor(d.getTime() / 1000);
}
function dateRange() {
  const since = $("since").value, until = $("until").value;
  return { since, until, from: dayStart(since), to: dayStart(until, 1) };
}
function dateParam() {
  const r = dateRange();
  return (r.from != null ? "&since=" + r.from : "") + (r.to != null ? "&until=" + r.to : "");
}
function dateLabel() {
  const r = dateRange();
  if (r.since && r.until) return r.since === r.until ? r.since : r.since + " 至 " + r.until;
  if (r.since) return r.since + " 起";
  if (r.until) return "截至 " + r.until;
  return "";
}

async function loadChat(opts) {
  const token = ++state.token;
  state.loading = true;
  let url = "/api/messages?chat=" + encodeURIComponent(state.chat) + typeParam();
  if (opts.around) url += "&around=" + opts.around;
  if (opts.before) url += "&before=" + encodeURIComponent(opts.before);
  if (opts.after) url += "&after=" + encodeURIComponent(opts.after);
  if (!opts.before && !opts.after) list.innerHTML = '<div class="loader">加载中…</div>';
  try {
    const page = await api(url);
    if (token !== state.token) return;
    const msgs = page.messages;
    if (opts.before) {
      const h = list.scrollHeight, top = list.scrollTop;
      list.querySelector(".loader.top")?.remove();
      list.insertAdjacentHTML("afterbegin", renderList(msgs, null, state.first));
      if (msgs.length) state.first = msgs[0];
      state.moreBefore = page.more_before;
      addEdgeLoaders();
      list.scrollTop = top + (list.scrollHeight - h);
    } else if (opts.after) {
      list.querySelector(".loader.bottom")?.remove();
      list.insertAdjacentHTML("beforeend", renderList(msgs, state.last, null));
      if (msgs.length) state.last = msgs[msgs.length - 1];
      state.moreAfter = page.more_after;
      addEdgeLoaders();
    } else {
      state.first = msgs[0] || null;
      state.last = msgs[msgs.length - 1] || null;
      state.moreBefore = page.more_before;
      state.moreAfter = page.more_after;
      list.innerHTML = msgs.length ? renderList(msgs, null, null) : '<div class="empty">没有消息</div>';
      enterList();
      addEdgeLoaders();
      const target = opts.around && list.querySelector('[data-id="' + opts.around + '"]');
      if (target) target.scrollIntoView({ block: "center" });
      else list.scrollTop = list.scrollHeight;
    }
  } catch (e) {
    if (token === state.token && !opts.before && !opts.after) list.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  } finally {
    if (token === state.token) state.loading = false;
  }
}

function addEdgeLoaders() {
  if (state.mode !== "chat") return;
  if (state.moreBefore && !list.querySelector(".loader.top"))
    list.insertAdjacentHTML("afterbegin", '<div class="loader top">向上滚动加载更早的消息</div>');
  if (state.moreAfter && !list.querySelector(".loader.bottom"))
    list.insertAdjacentHTML("beforeend", '<div class="loader bottom">向下滚动加载更新的消息</div>');
}

list.addEventListener("scroll", () => {
  if (state.loading) return;
  if (state.mode === "chat") {
    if (state.moreBefore && list.scrollTop < 200 && state.first) loadChat({ before: state.first.cursor });
    else if (state.moreAfter && list.scrollHeight - list.scrollTop - list.clientHeight < 200 && state.last)
      loadChat({ after: state.last.cursor });
  } else if (state.mode === "search" && state.next && list.scrollHeight - list.scrollTop - list.clientHeight < 300) {
    runSearch(true);
  }
}, { passive: true });

// Day dividers between messages of different days; ``prev`` / ``next`` are
// the neighbours already shown above / below the inserted ones.
function renderList(msgs, prev, next) {
  let out = "", last = prev;
  for (const m of msgs) {
    if (!last || new Date(last.ts * 1000).toDateString() !== new Date(m.ts * 1000).toDateString())
      out += '<div class="day"><span>' + fmtDay(m.ts) + "</span></div>";
    out += renderMsg(m, false);
    last = m;
  }
  if (next && last && new Date(last.ts * 1000).toDateString() === new Date(next.ts * 1000).toDateString()) {
    // Older messages go above ``next``, which had the divider of its day:
    // now the new ones open that day, so drop the old divider.
    list.querySelector(".day")?.remove();
  }
  return out;
}

// endregion
// region Message rendering

const URL_RE = /(https?:\/\/[^\s<>"'，。！？、）】」]+)/g;

function highlight(text, terms) {
  if (!terms.length) return esc(text);
  const re = new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return text.split(re).map((part, i) => i % 2 ? "<mark>" + esc(part) + "</mark>" : esc(part)).join("");
}
function richText(text, terms) {
  return text.split(URL_RE).map((part, i) => i % 2
    ? '<a href="' + esc(part) + '" target="_blank" rel="noopener noreferrer">' + highlight(part, terms) + "</a>"
    : highlight(part, terms)).join("");
}

function mediaHTML(m) {
  if (!m.media) return "";
  const src = "/api/media/" + m.id, mime = m.mime || "";
  if (m.type === "Image") return '<div class="media"><a class="zoom" href="' + src + '" target="_blank" rel="noopener"><img loading="lazy" src="' + src + '" alt="图片"></a></div>';
  if (m.type === "Sticker") {
    if (/tgs|lottie/.test(mime)) return '<div class="media placeholder">[动态表情]</div>';
    if (/video/.test(mime)) return '<div class="media"><video class="sticker" src="' + src + '" autoplay loop muted playsinline preload="metadata"></video></div>';
    return '<div class="media"><img class="sticker" loading="lazy" src="' + src + '" alt="表情"></div>';
  }
  if (m.type === "Video" || m.type === "Animation") {
    const gif = m.type === "Animation";
    return '<div class="media"><video src="' + src + '" preload="none" playsinline ' + (gif ? "loop muted controls" : "controls") + "></video></div>";
  }
  if (m.type === "Voice") return '<div class="media"><audio src="' + src + '" controls preload="none"></audio></div>';
  if (m.type === "File") return '<div class="actions"><a class="btn small" href="' + src + '">下载文件</a></div>';
  return "";
}

function renderMsg(m, inSearch) {
  const terms = inSearch && state.query ? state.query.q.split(/\s+/).filter(Boolean) : [];
  const cls = "msg" + (m.outgoing ? " out" : "") + (m.system ? " system" : "") + (state.target === m.id && !inSearch ? " target" : "");
  let body = "";
  if (m.reply) body += '<div class="reply" data-jump="' + m.reply.id + '"><b>' + esc(m.reply.sender) + "</b>：" +
    esc(m.reply.text || "[" + (TYPE_LABEL[m.reply.type] || m.reply.type) + "]") + "</div>";
  if (m.text) body += '<div class="msg-body">' + richText(m.text, terms) + "</div>";
  if (m.link) {
    const l = m.link;
    body += '<a class="link-card" href="' + esc(l.url || "#") + '" target="_blank" rel="noopener noreferrer">' +
      (l.image && /^https:/.test(l.image) ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(l.image) + '" alt="">' : "") +
      '<div><div class="lt">' + highlight(l.title || l.url || "链接", terms) + "</div>" +
      (l.description ? '<div class="ld">' + highlight(l.description, terms) + "</div>" : "") + "</div></a>";
  }
  if (m.location) body += '<div class="actions"><a class="btn small" target="_blank" rel="noopener noreferrer" href="https://maps.apple.com/?ll=' +
    encodeURIComponent(m.location[0] + "," + m.location[1]) + '">📍 查看位置</a></div>';
  body += mediaHTML(m);
  if (!m.text && !m.link && !m.location && !m.media) body += '<div class="msg-body placeholder">[' + esc(TYPE_LABEL[m.type] || m.type) + "]</div>";
  const actions = inSearch ? '<button class="btn small" data-context="' + m.id + '" data-chat="' + esc(m.chat) + '">查看上下文</button>' : "";
  const tg = m.tg ? '<a href="' + esc(m.tg) + '" target="_blank" rel="noopener noreferrer" title="在 Telegram 中打开">TG ↗</a>' : "";
  return '<article class="' + cls + '" data-id="' + m.id + '"><div class="msg-top"><span class="who">' + esc(m.sender) + "</span>" +
    (inSearch && m.chat_name && m.chat_name !== m.sender ? '<span class="where">' + esc(m.chat_name) + "</span>" : "") +
    '<span class="meta">' + esc(TYPE_LABEL[m.type] || m.type) + " · " + fmtTime(m.ts, true) +
    (PLACE_LABEL[m.place] ? " · " + PLACE_LABEL[m.place] : "") + tg + "</span></div>" + body +
    (actions ? '<div class="actions">' + actions + "</div>" : "") + "</article>";
}

// Images that cannot be loaded (expired in Telegram, hotlinking refused):
// hide them, and say so for media of the message itself.
document.addEventListener("error", (e) => {
  const el = e.target;
  if (!(el instanceof HTMLImageElement) || el.classList.contains("broken")) return;
  el.classList.add("broken");
  const media = el.closest(".media");
  if (media && !media.querySelector(".gone")) media.insertAdjacentHTML("beforeend", '<div class="gone">[图片无法获取]</div>');
}, true);

list.addEventListener("click", (e) => {
  const zoom = e.target.closest("a.zoom");
  // A plain click shows the image here; with a modifier key the link opens
  // it in a new tab as usual.
  if (zoom && !(e.metaKey || e.ctrlKey || e.shiftKey || e.button)) {
    e.preventDefault();
    if (!zoom.querySelector("img.broken")) openViewer(zoom.href);
    return;
  }
  const ctx = e.target.closest("[data-context]");
  if (ctx) { openChat(ctx.dataset.chat, Number(ctx.dataset.context)); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump && state.chat) openChat(state.chat, Number(jump.dataset.jump));
});

// endregion
// region Image viewer

// Open as a history entry, so that the back gesture on a phone closes it
// instead of leaving the page.
const viewer = $("viewer");
function openViewer(src) {
  $("viewer-img").src = src;
  viewer.showModal();
  history.pushState({ viewer: true }, "");
}
function closeViewer() {
  if (!viewer.open) return;
  if (history.state && history.state.viewer) history.back();
  else viewer.close();
}
$("viewer-body").onclick = closeViewer;
$("viewer-close").onclick = closeViewer;
viewer.addEventListener("cancel", (e) => { e.preventDefault(); closeViewer(); });
viewer.addEventListener("close", () => { $("viewer-img").removeAttribute("src"); });
window.addEventListener("popstate", () => { if (viewer.open) viewer.close(); });

// endregion
// region Search

// "from:name" (or "from:「a name」") picks the sender; the rest is the text.
function parseQuery(raw) {
  let sender = null;
  const q = raw.replace(/(?:^|\s)from[:：](?:「([^」]+)」|"([^"]+)"|(\S+))/i, (_, a, b, c) => { sender = a || b || c; return " "; });
  return { q: q.trim(), sender };
}

function startSearch(raw, chat) {
  const parsed = parseQuery(raw);
  if (!parsed.q && !parsed.sender && !state.types && !dateLabel()) return false;
  state.mode = "search";
  state.query = Object.assign(parsed, { chat, raw });
  state.next = null;
  state.target = null;
  const c = chat && state.chatMap.get(chat);
  setHeader(c ? "在「" + c.name + "」中搜索" : "搜索全部聊天",
    [parsed.q && "“" + parsed.q + "”", parsed.sender && "发送人：" + parsed.sender, dateLabel()].filter(Boolean).join(" · "));
  $("app").classList.add("viewing");
  runSearch(false);
  return true;
}

async function runSearch(more) {
  const token = ++state.token, s = state.query;
  state.loading = true;
  let url = "/api/search?q=" + encodeURIComponent(s.q) + typeParam() + dateParam();
  if (s.sender) url += "&sender=" + encodeURIComponent(s.sender);
  if (s.chat) url += "&chat=" + encodeURIComponent(s.chat);
  if (more && state.next) url += "&before=" + encodeURIComponent(state.next);
  if (!more) list.innerHTML = '<div class="loader">搜索中…</div>';
  const started = performance.now();
  try {
    const page = await api(url);
    if (token !== state.token) return;
    state.next = page.next;
    const html = page.messages.map((m) => renderMsg(m, true)).join("");
    if (more) {
      list.querySelector(".loader.bottom")?.remove();
      list.insertAdjacentHTML("beforeend", html);
    } else {
      list.innerHTML = html || '<div class="empty">没有找到</div>';
      enterList();
      list.scrollTop = 0;
      $("view-meta").textContent += " · 用时 " + Math.round(performance.now() - started) + " 毫秒";
    }
    if (state.next) list.insertAdjacentHTML("beforeend", '<div class="loader bottom">继续滚动加载更多</div>');
  } catch (e) {
    if (token === state.token && !more) list.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  } finally {
    if (token === state.token) state.loading = false;
  }
}

$("global-q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { state.chat = null; renderChats(); startSearch($("global-q").value, null); }
});
$("chat-search").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  const chat = state.chat || (state.query && state.query.chat);
  const v = $("chat-search").value.trim();
  if (!v && chat) openChat(chat);
  else if (v) startSearch(v, chat || null);
});
$("types").onchange = () => {
  state.types = $("types").value;
  if (state.mode === "chat") loadChat({});
  else if (state.mode === "search") runSearch(false);
};
// Picking a date searches with it: in a chat, that chat's messages in the
// range; otherwise the current search narrowed to it.
function onDates() {
  const since = $("since"), until = $("until");
  until.min = since.value;
  since.max = until.value;
  $("clear-dates").hidden = !since.value && !until.value;
  if (state.mode === "search") {
    // Nothing left to search by: back to the chat, or to the start.
    if (startSearch(state.query.raw, state.query.chat)) return;
    if (state.query.chat) openChat(state.query.chat);
    else {
      state.mode = "idle";
      setHeader("选择一个会话", "");
      list.innerHTML = '<div class="empty">从左边选一个会话，或在上方搜索全部聊天。</div>';
    }
  } else if (state.mode === "chat" && dateLabel()) startSearch("", state.chat);
}
function clearDates() {
  $("since").value = $("until").value = "";
  $("since").max = $("until").min = "";
  $("clear-dates").hidden = true;
}
$("since").onchange = onDates;
$("until").onchange = onDates;
$("clear-dates").onclick = () => { clearDates(); onDates(); };
$("back").onclick = () => { $("app").classList.remove("viewing"); placeKind(); };

// endregion
// region Devices

async function loadDevices() {
  const { devices } = await api("/api/devices");
  $("device-list").innerHTML = devices.map((d) =>
    '<div class="device"><span class="thumb" aria-hidden="true"><svg class="i"><use href="#i-device"/></svg></span><div class="info"><div class="n">' + esc(d.name) + (d.current ? '<span class="tag">当前</span>' : "") +
    (d.synced ? '<span class="tag">已同步</span>' : "") + '</div><div class="m">登记于 ' + fmtTime(d.created, true) +
    " · 最近使用 " + (d.last_used ? fmtAgo(d.last_used) : "–") + " · " + d.sessions + " 个会话</div></div>" +
    '<button class="btn small danger" data-revoke="' + esc(d.id) + '" data-current="' + (d.current ? 1 : "") + '">移除</button></div>'
  ).join("") || '<div class="empty">没有设备</div>';
}
$("open-devices").onclick = async () => {
  $("devices").showModal();
  try { await loadDevices(); } catch (e) { $("device-list").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; }
};
$("close-devices").onclick = () => $("devices").close();
$("device-list").onclick = async (e) => {
  const b = e.target.closest("[data-revoke]");
  if (!b) return;
  const current = !!b.dataset.current;
  if (!confirm(current ? "移除当前设备后会立即退出，要再用需重新登记。确定？" : "移除这个设备？用它登录的会话会立即失效。")) return;
  try {
    await api("/api/devices/" + encodeURIComponent(b.dataset.revoke), { method: "DELETE" });
    if (current) { $("devices").close(); showAuth(); } else { loadDevices(); loadStats(); }
  } catch (e) { alert(e.message); }
};
$("logout").onclick = async () => {
  try { await api("/api/logout", { body: {} }); } catch (e) { /* signed out anyway */ }
  $("devices").close();
  showAuth();
};

// endregion
// region Start

(async () => {
  const m = location.hash.match(/^#enroll=([\w-]+)$/);
  if (m) {
    enrollToken = m[1];
    history.replaceState(null, "", location.pathname);
  }
  if (!window.PublicKeyCredential) authMsg("这个浏览器不支持通行密钥。", true);
  if (enrollToken) { showAuth(); return; }
  try {
    const me = await api("/api/me", { quiet: true });
    if (me.signed_in) startApp(); else showAuth();
  } catch (e) { showAuth(); authMsg(e.message, true); }
  setInterval(() => { if (!$("app").hidden) loadStats(); }, 60000);
})();

// endregion
</script>
